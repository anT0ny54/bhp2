[build]
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "22.23.3"

[functions]
  node_bundler = "esbuild"
  # Keep Sharp external because it loads native binaries at runtime.
  external_node_modules = ["sharp"]
  # Netlify Node.js Functions use Linux x86_64 in this deployment.
  # Include only Sharp's matching native runtime packages, not every @img platform.
  included_files = [
    "node_modules/sharp/**/*",
    "node_modules/@img/sharp-linux-x64/**/*",
    "node_modules/@img/sharp-libvips-linux-x64/**/*"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
