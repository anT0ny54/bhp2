[build]
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  # Keep Sharp external because it loads native binaries at runtime.
  external_node_modules = ["sharp"]
  # Netlify Node.js Functions use Linux x86_64 in this deployment.
  # Include only Sharp's matching native runtime packages, not every @img platform.
  included_files = [
    "node_modules/sharp/**/*",
    "node_modules/@img/sharp-linux-x64/**/*",
    "node_modules/@img/sharp-libvips-linux-x64/**/*"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# NOTE: CORS headers for /api/* responses are set inside the functions from
# util/headers.js (the single source of truth). Do NOT re-add CORS headers here:
# the hand-copied duplication between this file and util/headers.js is the drift
# pattern that caused regressions in 2.2.4/2.2.6.
# The three security headers in the /* block below also match /api/* by path.
# They are needed for the static pages, and they must carry the same values as
# util/headers.js; tests/health.test.js fails if they drift apart.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Static site assets are stable between releases; modest browser caching
# avoids re-downloading site.js/site.css on every repeat visit.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
