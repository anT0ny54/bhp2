name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only runs checks and never pushes anything.
permissions:
  contents: read

jobs:
  check:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Same version Netlify builds and runs with (netlify.toml).
          node-version: "22.23.3"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          # --frozen-lockfile makes the install reproducible: it fails instead
          # of silently rewriting yarn.lock. Optional dependencies stay enabled
          # because Sharp's native binaries are optional packages.
          # --ignore-scripts keeps dependency lifecycle scripts from running.
          yarn install --frozen-lockfile --ignore-scripts

      - name: Validate and test
        shell: bash
        run: |
          set -Eeuo pipefail

          # Not `yarn check`: that is a built-in Yarn Classic command.
          yarn run check
