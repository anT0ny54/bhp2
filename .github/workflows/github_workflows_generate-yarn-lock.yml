name: Generate yarn.lock

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - .yarn/**
      - .github/workflows/github_workflows_generate-yarn-lock.yml

  workflow_dispatch:

  schedule:
    # Weekly, Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

concurrency:
  group: generate-yarn-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate and commit yarn.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable

      - name: Verify Yarn
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f package.json
          yarn --version

      - name: Update lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          # --ignore-scripts prevents dependency lifecycle scripts from running.
          # It works with both Yarn Classic and modern Yarn versions.
          yarn install --ignore-scripts

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- yarn.lock

          if git diff --cached --quiet -- yarn.lock; then
            echo "No changes detected in yarn.lock."
            exit 0
          fi

          git commit \
            -m "chore(deps): update yarn.lock [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"
          
