name: Update Yarn lockfile

on:
  workflow_dispatch:

concurrency:
  group: update-yarn-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    name: Refresh dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable

      - name: Refresh dependencies within declared version ranges
        shell: bash
        run: |
          set -Eeuo pipefail
          # Yarn Classic refreshes resolutions within package.json's declared
          # ranges. Exact-pinned direct dependencies remain pinned.
          yarn upgrade --non-interactive --ignore-scripts
          yarn install --non-interactive --ignore-scripts

      - name: Verify Sharp native package pins
        shell: bash
        run: |
          set -Eeuo pipefail
          yarn run check:sharp-pins

      - name: Create pull request for lockfile changes
        uses: peter-evans/create-pull-request@v8
        with:
          # Pull requests opened with the default GITHUB_TOKEN do not trigger
          # other workflows, so CI would never run on the lockfile PR. Store a
          # fine-grained PAT (contents + pull-requests: write) or GitHub App
          # token as the LOCKFILE_PR_TOKEN secret to get CI on it; without the
          # secret this falls back to GITHUB_TOKEN and CI must be run manually.
          token: ${{ secrets.LOCKFILE_PR_TOKEN || github.token }}
          branch: chore/update-yarn-lock
          delete-branch: true
          base: main
          add-paths: yarn.lock
          commit-message: "chore: refresh Yarn lockfile"
          title: "chore: refresh Yarn lockfile"
          body: |
            This pull request was generated by the manually triggered **Update Yarn lockfile** workflow.

            - Refreshes dependency resolutions within the version ranges declared in `package.json`.
            - Keeps exact-pinned direct dependencies pinned.
            - Runs the Sharp native-package pin check before proposing the lockfile.

            Please review the dependency diff and ensure CI passes before merging.
            If CI did not start automatically (no `LOCKFILE_PR_TOKEN` secret), run the CI workflow manually on this branch.
